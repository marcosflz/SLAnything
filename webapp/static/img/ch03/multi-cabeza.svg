<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" role="img" aria-labelledby="mhTitle mhDesc">
  <title id="mhTitle">Multi-head attention: varias cabezas, concatenación y proyección de salida</title>
  <desc id="mhDesc">La entrada se reparte entre varias cabezas, cada una con sus propias proyecciones Q, K y V. Las salidas se concatenan y una matriz W sub O las combina en el vector de contexto.</desc>
  <defs>
    <marker id="mhArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="430" rx="18" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="40" y="44" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="700" fill="#0f172a">Multi-head attention</text>
  <text x="40" y="68" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#64748b">Cada cabeza mira desde un subespacio distinto; la concatenación conserva sus aportes.</text>

  <rect x="40" y="170" width="110" height="86" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="95" y="207" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#1e3a8a">X</text>
  <text x="95" y="229" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#475569">n × d_model</text>

  <line x1="150" y1="196" x2="196" y2="112" stroke="#64748b" stroke-width="1.6" marker-end="url(#mhArrow)"/>
  <line x1="150" y1="210" x2="196" y2="210" stroke="#64748b" stroke-width="1.6" marker-end="url(#mhArrow)"/>
  <line x1="150" y1="230" x2="196" y2="308" stroke="#64748b" stroke-width="1.6" marker-end="url(#mhArrow)"/>

  <rect x="200" y="80" width="250" height="64" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="220" y="105" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#92400e">Head 1</text>
  <text x="220" y="125" font-family="Consolas, monospace" font-size="11" fill="#92400e">W_Q1 · W_K1 · W_V1 → atención</text>
  <text x="430" y="105" text-anchor="end" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#92400e">d_head</text>

  <rect x="200" y="178" width="250" height="64" rx="12" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.5"/>
  <text x="220" y="203" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#115e59">Head 2</text>
  <text x="220" y="223" font-family="Consolas, monospace" font-size="11" fill="#115e59">W_Q2 · W_K2 · W_V2 → atención</text>
  <text x="430" y="203" text-anchor="end" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#115e59">d_head</text>

  <rect x="200" y="276" width="250" height="64" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="220" y="301" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#5b21b6">Head h</text>
  <text x="220" y="321" font-family="Consolas, monospace" font-size="11" fill="#5b21b6">W_Qh · W_Kh · W_Vh → atención</text>
  <text x="430" y="301" text-anchor="end" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#5b21b6">d_head</text>

  <line x1="450" y1="112" x2="520" y2="188" stroke="#64748b" stroke-width="1.6" marker-end="url(#mhArrow)"/>
  <line x1="450" y1="210" x2="520" y2="210" stroke="#64748b" stroke-width="1.6" marker-end="url(#mhArrow)"/>
  <line x1="450" y1="308" x2="520" y2="232" stroke="#64748b" stroke-width="1.6" marker-end="url(#mhArrow)"/>

  <rect x="525" y="166" width="128" height="88" rx="12" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
  <text x="589" y="196" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f172a">concat</text>
  <text x="589" y="218" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#475569">h × d_head</text>
  <text x="589" y="236" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#475569">= d_model</text>

  <line x1="653" y1="210" x2="686" y2="210" stroke="#64748b" stroke-width="1.6" marker-end="url(#mhArrow)"/>
  <rect x="690" y="176" width="92" height="68" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="736" y="205" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#92400e">W_O</text>
  <text x="736" y="225" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#92400e">proyección</text>

  <line x1="782" y1="210" x2="816" y2="210" stroke="#64748b" stroke-width="1.6" marker-end="url(#mhArrow)"/>
  <rect x="820" y="176" width="100" height="68" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="870" y="205" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#047857">Z</text>
  <text x="870" y="225" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#047857">n × d_model</text>

  <line x1="40" y1="370" x2="920" y2="370" stroke="#e2e8f0" stroke-width="1"/>
  <text x="40" y="397" font-family="Consolas, monospace" font-size="13" fill="#334155">d_head = d_model / h</text>
  <text x="300" y="397" font-family="Consolas, monospace" font-size="13" fill="#334155">Z = concat(head_1, …, head_h) · W_O</text>
  <text x="690" y="397" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#64748b">GPT-2 small: 768 / 12 = 64</text>
</svg>
