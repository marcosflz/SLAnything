<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" role="img" aria-labelledby="qkvTitle qkvDesc">
  <title id="qkvTitle">De un token a un vector de contexto mediante consultas, claves y valores</title>
  <desc id="qkvDesc">Un token se proyecta con tres matrices en Q, K y V. La consulta se compara con las claves, softmax reparte pesos y la suma ponderada de los valores produce el contexto.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="430" rx="18" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="40" y="44" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="700" fill="#0f172a">Q, K, V: una búsqueda blanda</text>
  <text x="40" y="68" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#64748b">Cada token se proyecta en consulta, clave y valor; los pesos mezclan los valores.</text>

  <rect x="40" y="170" width="120" height="72" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="100" y="199" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#1e3a8a">token x</text>
  <text x="100" y="220" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#475569">embedding</text>

  <line x1="160" y1="196" x2="222" y2="116" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="160" y1="206" x2="222" y2="206" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="160" y1="218" x2="222" y2="298" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>

  <rect x="225" y="88" width="96" height="54" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="273" y="111" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#92400e">W_Q</text>
  <text x="273" y="129" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#92400e">aprende</text>

  <rect x="225" y="179" width="96" height="54" rx="10" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
  <text x="273" y="202" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#115e59">W_K</text>
  <text x="273" y="220" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#115e59">aprende</text>

  <rect x="225" y="270" width="96" height="54" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="273" y="293" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#5b21b6">W_V</text>
  <text x="273" y="311" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#5b21b6">aprende</text>

  <line x1="321" y1="115" x2="348" y2="115" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="321" y1="206" x2="348" y2="206" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="321" y1="297" x2="348" y2="297" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>

  <rect x="352" y="88" width="76" height="54" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="390" y="121" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#92400e">Q</text>
  <rect x="352" y="179" width="76" height="54" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.5"/>
  <text x="390" y="212" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#115e59">K</text>
  <rect x="352" y="270" width="76" height="54" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="390" y="303" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#5b21b6">V</text>

  <line x1="428" y1="112" x2="470" y2="158" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="428" y1="205" x2="470" y2="192" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>

  <rect x="475" y="140" width="132" height="74" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="541" y="169" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f172a">QKᵀ / √d_k</text>
  <text x="541" y="191" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#475569">puntuaciones</text>

  <line x1="607" y1="177" x2="636" y2="177" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>
  <rect x="640" y="140" width="104" height="74" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="692" y="172" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#1e3a8a">softmax</text>
  <text x="692" y="193" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#1e40af">por filas</text>

  <line x1="744" y1="177" x2="776" y2="177" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>
  <rect x="780" y="140" width="112" height="74" rx="12" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text x="836" y="170" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#075985">α</text>
  <text x="836" y="192" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#075985">suman 1</text>

  <line x1="836" y1="214" x2="812" y2="276" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="428" y1="300" x2="754" y2="310" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>
  <circle cx="800" cy="310" r="38" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
  <text x="800" y="307" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#0f172a">Σ α·V</text>
  <text x="800" y="325" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#475569">mezcla</text>

  <line x1="838" y1="310" x2="864" y2="310" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>
  <rect x="868" y="282" width="58" height="56" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="897" y="316" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#047857">z</text>

  <line x1="40" y1="370" x2="920" y2="370" stroke="#e2e8f0" stroke-width="1"/>
  <text x="40" y="397" font-family="Consolas, monospace" font-size="13" fill="#334155">z = Σ α · V</text>
  <text x="210" y="397" font-family="Consolas, monospace" font-size="13" fill="#334155">α = softmax(QKᵀ / √d_k)</text>
  <text x="520" y="397" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#64748b">Cada fila de α reparte la atención de un token entre todas las claves.</text>
</svg>
