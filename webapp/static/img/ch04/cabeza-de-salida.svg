<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 480" role="img" aria-labelledby="title desc">
  <title id="title">De un vector contextual a un token</title>
  <desc id="desc">Un vector de 768 dimensiones se proyecta con una matriz de 768 por 50 257 y produce 50 257 logits. Softmax los convierte en probabilidades y argmax elige el token más probable.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="1100" height="480" fill="#ffffff"/>
  <text x="42" y="48" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="26" font-weight="750" fill="#0f172a">De 768 dimensiones a 50 257 logits</text>
  <text x="42" y="76" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="14" fill="#64748b">La cabeza de salida puntúa cada token del vocabulario; softmax convierte esas puntuaciones en una distribución.</text>

  <!-- boxes -->
  <rect x="30" y="132" width="168" height="92" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.6"/>
  <text x="114" y="164" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="13" font-weight="750" fill="#1d4ed8">Vector contextual</text>
  <text x="114" y="186" text-anchor="middle" font-family="ui-monospace, Consolas, monospace" font-size="12" fill="#3b82f6">[768]</text>
  <text x="114" y="206" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="10.5" fill="#64748b">última posición</text>

  <rect x="250" y="132" width="206" height="92" rx="12" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.6"/>
  <text x="353" y="162" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="13" font-weight="750" fill="#6d28d9">Proyección lineal</text>
  <text x="353" y="184" text-anchor="middle" font-family="ui-monospace, Consolas, monospace" font-size="12" fill="#7c3aed">768 × 50 257</text>
  <text x="353" y="204" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="10.5" fill="#64748b">sin sesgo · 38 597 376 pesos</text>

  <rect x="508" y="132" width="168" height="92" rx="12" fill="#fff7ed" stroke="#fdba74" stroke-width="1.6"/>
  <text x="592" y="164" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="13" font-weight="750" fill="#b45309">Logits</text>
  <text x="592" y="186" text-anchor="middle" font-family="ui-monospace, Consolas, monospace" font-size="12" fill="#d97706">[50 257]</text>
  <text x="592" y="206" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="10.5" fill="#64748b">sin normalizar</text>

  <rect x="728" y="132" width="150" height="92" rx="12" fill="#f0fdf4" stroke="#86efac" stroke-width="1.6"/>
  <text x="803" y="164" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="13" font-weight="750" fill="#047857">Softmax</text>
  <text x="803" y="186" text-anchor="middle" font-family="ui-monospace, Consolas, monospace" font-size="12" fill="#059669">Σ = 1</text>
  <text x="803" y="206" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="10.5" fill="#64748b">distribución</text>

  <rect x="930" y="132" width="140" height="92" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.6"/>
  <text x="1000" y="158" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12.5" font-weight="750" fill="#334155">Token elegido</text>
  <text x="1000" y="184" text-anchor="middle" font-family="ui-monospace, Consolas, monospace" font-size="12" fill="#475569">argmax</text>
  <text x="1000" y="206" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="10.5" fill="#64748b">generación voraz</text>

  <!-- arrows -->
  <g stroke="#64748b" stroke-width="1.8" fill="none" marker-end="url(#arrow)">
    <path d="M 200 178 L 244 178"/>
    <path d="M 458 178 L 502 178"/>
    <path d="M 678 178 L 722 178"/>
    <path d="M 880 178 L 924 178"/>
  </g>

  <!-- probability bars -->
  <text x="42" y="292" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="13" font-weight="750" fill="#334155">Ejemplo ilustrativo de la distribución final</text>
  <g font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11.5" fill="#475569">
    <text x="42" y="326">«sofá»</text>
    <rect x="130" y="314" width="250" height="16" rx="4" fill="#93c5fd"/>
    <text x="390" y="327" font-family="ui-monospace, Consolas, monospace" fill="#1d4ed8">0,34</text>

    <text x="42" y="356">«colchón»</text>
    <rect x="130" y="344" width="140" height="16" rx="4" fill="#bfdbfe"/>
    <text x="280" y="357" font-family="ui-monospace, Consolas, monospace" fill="#1d4ed8">0,18</text>

    <text x="42" y="386">«suelo»</text>
    <rect x="130" y="374" width="95" height="16" rx="4" fill="#dbeafe"/>
    <text x="235" y="387" font-family="ui-monospace, Consolas, monospace" fill="#1d4ed8">0,12</text>

    <text x="42" y="416">otros</text>
    <rect x="130" y="404" width="500" height="16" rx="4" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="640" y="417" font-family="ui-monospace, Consolas, monospace" fill="#1d4ed8">0,36</text>
  </g>

  <!-- right note -->
  <rect x="720" y="276" width="340" height="156" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="740" y="302" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12.5" font-weight="750" fill="#334155">Pesos atados</text>
  <text x="740" y="326" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11.5" fill="#475569">La misma matriz de 50 257 × 768 puede</text>
  <text x="740" y="346" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11.5" fill="#475569">servir de embeddings de entrada y de</text>
  <text x="740" y="366" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11.5" fill="#475569">cabeza de salida. El modelo pasa de</text>
  <text x="740" y="386" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11.5" fill="#475569">163 009 536 a 124 412 160 parámetros.</text>
  <text x="740" y="412" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="10.5" fill="#64748b">El ejemplo de barras es didáctico, no una salida real.</text>
</svg>
