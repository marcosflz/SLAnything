<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 450" role="img" aria-labelledby="title desc">
  <title id="title">Máscara de pérdida: qué posiciones cuentan</title>
  <desc id="desc">Ocho posiciones de un objetivo desplazado. Las tres primeras son contexto y pueden enmascararse; las dos siguientes son respuesta y contribuyen; después se conserva un EOS; las dos últimas son relleno y se marcan con -100 para que la pérdida las ignore.</desc>

  <rect x="1" y="1" width="998" height="448" rx="18" fill="#ffffff" stroke="#dbe3ee" stroke-width="2"/>

  <text x="32" y="42" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#0f172a">Máscara de pérdida: qué posiciones cuentan</text>
  <text x="32" y="68" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#475569">Los objetivos ya están desplazados una posición. El relleno se sustituye por -100.</text>

  <!-- group labels -->
  <text x="235" y="106" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#475569">contexto</text>
  <text x="514" y="106" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#047857">respuesta</text>
  <text x="679" y="106" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#047857">fin</text>
  <text x="835" y="106" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#991b1b">relleno</text>

  <!-- context boxes -->
  <g font-family="Consolas, monospace" font-size="18" font-weight="700">
    <rect x="75" y="120" width="95" height="56" rx="10" fill="#e2e8f0" stroke="#94a3b8" stroke-dasharray="5 4"/>
    <text x="122" y="155" text-anchor="middle" fill="#334155">B</text>
    <rect x="182" y="120" width="95" height="56" rx="10" fill="#e2e8f0" stroke="#94a3b8" stroke-dasharray="5 4"/>
    <text x="229" y="155" text-anchor="middle" fill="#334155">C</text>
    <rect x="289" y="120" width="95" height="56" rx="10" fill="#e2e8f0" stroke="#94a3b8" stroke-dasharray="5 4"/>
    <text x="336" y="155" text-anchor="middle" fill="#334155">D</text>

    <!-- response boxes -->
    <rect x="408" y="120" width="95" height="56" rx="10" fill="#dcfce7" stroke="#10b981" stroke-width="2"/>
    <text x="455" y="155" text-anchor="middle" fill="#065f46">E</text>
    <rect x="515" y="120" width="95" height="56" rx="10" fill="#dcfce7" stroke="#10b981" stroke-width="2"/>
    <text x="562" y="155" text-anchor="middle" fill="#065f46">F</text>

    <!-- EOS box -->
    <rect x="632" y="120" width="95" height="56" rx="10" fill="#dcfce7" stroke="#10b981" stroke-width="2"/>
    <text x="679" y="155" text-anchor="middle" fill="#065f46">EOS</text>

    <!-- padding boxes -->
    <rect x="739" y="120" width="95" height="56" rx="10" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/>
    <text x="786" y="155" text-anchor="middle" fill="#991b1b">-100</text>
    <rect x="846" y="120" width="95" height="56" rx="10" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/>
    <text x="893" y="155" text-anchor="middle" fill="#991b1b">-100</text>
  </g>

  <!-- position numbers -->
  <g font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#64748b" text-anchor="middle">
    <text x="122" y="196">1</text>
    <text x="229" y="196">2</text>
    <text x="336" y="196">3</text>
    <text x="455" y="196">4</text>
    <text x="562" y="196">5</text>
    <text x="679" y="196">6</text>
    <text x="786" y="196">7</text>
    <text x="893" y="196">8</text>
  </g>

  <!-- loss pills -->
  <g font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle">
    <rect x="92" y="218" width="61" height="30" rx="15" fill="#fef3c7" stroke="#f59e0b"/>
    <text x="122" y="238" fill="#92400e">opcional</text>
    <rect x="199" y="218" width="61" height="30" rx="15" fill="#fef3c7" stroke="#f59e0b"/>
    <text x="229" y="238" fill="#92400e">opcional</text>
    <rect x="306" y="218" width="61" height="30" rx="15" fill="#fef3c7" stroke="#f59e0b"/>
    <text x="336" y="238" fill="#92400e">opcional</text>

    <rect x="432" y="218" width="46" height="30" rx="15" fill="#dcfce7" stroke="#10b981"/>
    <text x="455" y="238" fill="#065f46">sí</text>
    <rect x="539" y="218" width="46" height="30" rx="15" fill="#dcfce7" stroke="#10b981"/>
    <text x="562" y="238" fill="#065f46">sí</text>
    <rect x="656" y="218" width="46" height="30" rx="15" fill="#dcfce7" stroke="#10b981"/>
    <text x="679" y="238" fill="#065f46">sí</text>

    <rect x="770" y="218" width="32" height="30" rx="15" fill="#fee2e2" stroke="#ef4444"/>
    <text x="786" y="238" fill="#991b1b">no</text>
    <rect x="877" y="218" width="32" height="30" rx="15" fill="#fee2e2" stroke="#ef4444"/>
    <text x="893" y="238" fill="#991b1b">no</text>
  </g>

  <!-- annotation: optional instruction mask -->
  <path d="M 75 274 L 75 290 L 384 290 L 384 274" fill="none" stroke="#f59e0b" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="229" y="312" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#92400e">Si enmascaras la instrucción, aquí también va -100.</text>

  <!-- annotation: padding always ignored -->
  <path d="M 739 274 L 739 290 L 941 290 L 941 274" fill="none" stroke="#ef4444" stroke-width="2"/>
  <text x="840" y="312" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#991b1b">El relleno nunca contribuye.</text>

  <!-- annotation: EOS kept -->
  <text x="679" y="330" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#047857">El primer EOS se conserva para aprender a parar.</text>

  <!-- legend -->
  <rect x="32" y="342" width="936" height="82" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
  <rect x="52" y="360" width="24" height="18" rx="4" fill="#e2e8f0" stroke="#94a3b8" stroke-dasharray="4 3"/>
  <text x="86" y="374" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#334155">contexto: se puede enmascarar</text>
  <rect x="322" y="360" width="24" height="18" rx="4" fill="#dcfce7" stroke="#10b981"/>
  <text x="356" y="374" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#334155">respuesta y fin: contribuyen</text>
  <rect x="592" y="360" width="24" height="18" rx="4" fill="#fee2e2" stroke="#ef4444"/>
  <text x="626" y="374" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#334155">relleno: -100, ignorado</text>
  <text x="52" y="404" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#475569">La entrada conserva el relleno para que el modelo procese el lote; el objetivo lo ignora.</text>
  <text x="52" y="420" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#64748b">Diagrama propio de Aula LLM · Capítulo 7</text>
</svg>
