<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 430" role="img" aria-labelledby="title desc">
  <title id="title">Plantilla de chat: de roles a tokens</title>
  <desc id="desc">Tres turnos de una conversación, system, user y assistant, delimitados por los tokens especiales im_start e im_end. La respuesta del asistente aparece resaltada como la zona que contribuye a la pérdida.</desc>

  <rect x="1" y="1" width="978" height="428" rx="18" fill="#ffffff" stroke="#dbe3ee" stroke-width="2"/>

  <text x="32" y="42" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#0f172a">Plantilla de chat: de roles a tokens</text>
  <text x="32" y="68" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#475569">El modelo no ve «quién habla»: ve marcadores, texto y una frontera para cada turno.</text>

  <!-- system row -->
  <rect x="28" y="96" width="118" height="38" rx="9" fill="#eef2ff" stroke="#c7d2fe"/>
  <text x="87" y="120" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#3730a3">system</text>
  <rect x="160" y="96" width="132" height="38" rx="9" fill="#ede9fe" stroke="#8b5cf6"/>
  <text x="226" y="120" text-anchor="middle" font-family="Consolas, monospace" font-size="14" font-weight="700" fill="#5b21b6">&lt;|im_start|&gt;</text>
  <rect x="304" y="96" width="470" height="38" rx="9" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="320" y="120" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#334155">Eres un asistente breve y preciso.</text>
  <rect x="786" y="96" width="118" height="38" rx="9" fill="#ede9fe" stroke="#8b5cf6"/>
  <text x="845" y="120" text-anchor="middle" font-family="Consolas, monospace" font-size="14" font-weight="700" fill="#5b21b6">&lt;|im_end|&gt;</text>

  <!-- user row -->
  <rect x="28" y="154" width="118" height="38" rx="9" fill="#ecfeff" stroke="#a5f3fc"/>
  <text x="87" y="178" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#155e75">user</text>
  <rect x="160" y="154" width="132" height="38" rx="9" fill="#ede9fe" stroke="#8b5cf6"/>
  <text x="226" y="178" text-anchor="middle" font-family="Consolas, monospace" font-size="14" font-weight="700" fill="#5b21b6">&lt;|im_start|&gt;</text>
  <rect x="304" y="154" width="470" height="38" rx="9" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="320" y="178" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#334155">Convierte a pasiva: «El chef cocina la cena».</text>
  <rect x="786" y="154" width="118" height="38" rx="9" fill="#ede9fe" stroke="#8b5cf6"/>
  <text x="845" y="178" text-anchor="middle" font-family="Consolas, monospace" font-size="14" font-weight="700" fill="#5b21b6">&lt;|im_end|&gt;</text>

  <!-- assistant row, highlighted -->
  <rect x="20" y="212" width="892" height="52" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <rect x="28" y="219" width="118" height="38" rx="9" fill="#dcfce7" stroke="#86efac"/>
  <text x="87" y="243" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#166534">assistant</text>
  <rect x="160" y="219" width="132" height="38" rx="9" fill="#ede9fe" stroke="#8b5cf6"/>
  <text x="226" y="243" text-anchor="middle" font-family="Consolas, monospace" font-size="14" font-weight="700" fill="#5b21b6">&lt;|im_start|&gt;</text>
  <rect x="304" y="219" width="470" height="38" rx="9" fill="#ffffff" stroke="#a7f3d0"/>
  <text x="320" y="243" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#065f46">La cena es cocinada por el chef.</text>
  <rect x="786" y="219" width="118" height="38" rx="9" fill="#dcfce7" stroke="#10b981"/>
  <text x="845" y="243" text-anchor="middle" font-family="Consolas, monospace" font-size="14" font-weight="700" fill="#166534">&lt;|im_end|&gt;</text>

  <!-- legend -->
  <rect x="28" y="300" width="440" height="96" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="46" y="326" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f172a">Leyenda</text>
  <rect x="46" y="340" width="26" height="18" rx="4" fill="#ede9fe" stroke="#8b5cf6"/>
  <text x="82" y="354" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#334155">token especial de turno</text>
  <rect x="246" y="340" width="26" height="18" rx="4" fill="#ecfdf5" stroke="#10b981"/>
  <text x="282" y="354" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#334155">zona con pérdida</text>
  <text x="46" y="380" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#475569">El mismo texto se usa al entrenar y al inferir.</text>

  <rect x="496" y="300" width="456" height="96" rx="12" fill="#fff7ed" stroke="#fed7aa"/>
  <text x="514" y="326" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#9a3412">Regla práctica</text>
  <text x="514" y="350" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#7c2d12">Si cambias un espacio, un salto de línea o un marcador,</text>
  <text x="514" y="370" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#7c2d12">cambias la secuencia que el modelo aprendió a interpretar.</text>
  <text x="514" y="388" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#9a3412">Versión 1 · mismo formato en train e inferencia</text>
</svg>
