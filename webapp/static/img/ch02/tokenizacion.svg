<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" role="img" aria-labelledby="titulo descripcion">
  <title id="titulo">Del texto a los identificadores</title>
  <desc id="descripcion">Una frase se divide en tokens y cada token se convierte en un identificador numérico mediante el vocabulario.</desc>
  <rect width="960" height="430" fill="#f8fafc"/>
  <text x="48" y="48" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#0f172a">Del texto a los IDs</text>
  <text x="48" y="74" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#64748b">tokenizar · consultar el vocabulario · codificar</text>

  <text x="48" y="122" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#64748b" letter-spacing="1.4">TEXTO</text>
  <rect x="48" y="134" width="864" height="58" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="72" y="170" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#0f172a">El gato duerme sobre el sofá.</text>

  <path d="M480 196 L480 224" stroke="#94a3b8" stroke-width="2"/>
  <path d="M472 216 L480 226 L488 216" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <text x="48" y="254" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#64748b" letter-spacing="1.4">TOKENS</text>
  <g font-family="Segoe UI, Arial, sans-serif" font-size="17" text-anchor="middle">
    <rect x="48" y="266" width="116" height="46" rx="9" fill="#dbeafe" stroke="#93c5fd"/>
    <text x="106" y="295" fill="#1e3a8a">El</text>
    <rect x="172" y="266" width="116" height="46" rx="9" fill="#dbeafe" stroke="#93c5fd"/>
    <text x="230" y="295" fill="#1e3a8a">gato</text>
    <rect x="296" y="266" width="128" height="46" rx="9" fill="#ede9fe" stroke="#c4b5fd"/>
    <text x="360" y="295" fill="#4c1d95">duerme</text>
    <rect x="432" y="266" width="116" height="46" rx="9" fill="#ede9fe" stroke="#c4b5fd"/>
    <text x="490" y="295" fill="#4c1d95">sobre</text>
    <rect x="556" y="266" width="88" height="46" rx="9" fill="#dbeafe" stroke="#93c5fd"/>
    <text x="600" y="295" fill="#1e3a8a">el</text>
    <rect x="652" y="266" width="116" height="46" rx="9" fill="#ccfbf1" stroke="#5eead4"/>
    <text x="710" y="295" fill="#134e4a">sofá</text>
    <rect x="776" y="266" width="64" height="46" rx="9" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="808" y="295" fill="#334155">.</text>
  </g>

  <path d="M480 322 L480 346" stroke="#94a3b8" stroke-width="2"/>
  <path d="M472 338 L480 348 L488 338" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <text x="48" y="370" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#64748b" letter-spacing="1.4">IDs</text>
  <g font-family="Consolas, monospace" font-size="16" text-anchor="middle" font-weight="700">
    <rect x="48" y="382" width="116" height="34" rx="7" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="106" y="404" fill="#2563eb">12</text>
    <rect x="172" y="382" width="116" height="34" rx="7" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="230" y="404" fill="#2563eb">847</text>
    <rect x="296" y="382" width="128" height="34" rx="7" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="360" y="404" fill="#7c3aed">2 103</text>
    <rect x="432" y="382" width="116" height="34" rx="7" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="490" y="404" fill="#7c3aed">55</text>
    <rect x="556" y="382" width="88" height="34" rx="7" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="600" y="404" fill="#2563eb">12</text>
    <rect x="652" y="382" width="116" height="34" rx="7" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="710" y="404" fill="#0f766e">3 901</text>
    <rect x="776" y="382" width="64" height="34" rx="7" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="808" y="404" fill="#475569">4</text>
  </g>

  <g font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#94a3b8">
    <text x="846" y="170">texto original</text>
    <text x="846" y="294">unidades</text>
    <text x="846" y="404">claves</text>
  </g>
</svg>
