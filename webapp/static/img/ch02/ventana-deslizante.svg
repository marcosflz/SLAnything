<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" role="img" aria-labelledby="titulo descripcion">
  <title id="titulo">Ventana deslizante con contexto cinco y stride dos</title>
  <desc id="descripcion">Una secuencia de tokens se recorre con ventanas de cinco posiciones que avanzan dos posiciones cada vez, de modo que se solapan en tres tokens.</desc>
  <rect width="960" height="430" fill="#f8fafc"/>
  <text x="48" y="48" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#0f172a">Ventana deslizante</text>
  <text x="48" y="74" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#64748b">contexto = 5 · stride = 2 · tres tokens de solapamiento</text>

  <g font-family="Segoe UI, Arial, sans-serif" font-size="14" text-anchor="middle">
    <g fill="#ffffff" stroke="#cbd5e1">
      <rect x="48" y="102" width="82" height="40" rx="7"/>
      <rect x="138" y="102" width="82" height="40" rx="7"/>
      <rect x="228" y="102" width="82" height="40" rx="7"/>
      <rect x="318" y="102" width="82" height="40" rx="7"/>
      <rect x="408" y="102" width="82" height="40" rx="7"/>
      <rect x="498" y="102" width="82" height="40" rx="7"/>
      <rect x="588" y="102" width="82" height="40" rx="7"/>
      <rect x="678" y="102" width="82" height="40" rx="7"/>
      <rect x="768" y="102" width="82" height="40" rx="7"/>
      <rect x="858" y="102" width="54" height="40" rx="7"/>
    </g>
    <g fill="#334155">
      <text x="89" y="128">El</text>
      <text x="179" y="128">gato</text>
      <text x="269" y="128">duerme</text>
      <text x="359" y="128">sobre</text>
      <text x="449" y="128">el</text>
      <text x="539" y="128">sofá</text>
      <text x="629" y="128">porque</text>
      <text x="719" y="128">tiene</text>
      <text x="809" y="128">sueño</text>
      <text x="885" y="128">.</text>
    </g>
  </g>

  <g font-family="Segoe UI, Arial, sans-serif" font-size="12">
    <text x="48" y="178" fill="#64748b" font-weight="700" letter-spacing="1">VENTANA 1</text>
    <rect x="48" y="188" width="442" height="44" rx="9" fill="#dbeafe" stroke="#60a5fa" stroke-width="2"/>
    <g fill="#1e3a8a" font-size="13" text-anchor="middle">
      <text x="89" y="215">El</text>
      <text x="179" y="215">gato</text>
      <text x="269" y="215">duerme</text>
      <text x="359" y="215">sobre</text>
      <text x="449" y="215">el</text>
    </g>
    <text x="506" y="215" fill="#2563eb">posiciones 0–4</text>

    <text x="48" y="264" fill="#64748b" font-weight="700" letter-spacing="1">VENTANA 2</text>
    <rect x="228" y="274" width="442" height="44" rx="9" fill="#ede9fe" stroke="#a78bfa" stroke-width="2"/>
    <g fill="#4c1d95" font-size="13" text-anchor="middle">
      <text x="269" y="301">duerme</text>
      <text x="359" y="301">sobre</text>
      <text x="449" y="301">el</text>
      <text x="539" y="301">sofá</text>
      <text x="629" y="301">porque</text>
    </g>
    <text x="686" y="301" fill="#7c3aed">posiciones 2–6</text>

    <text x="48" y="350" fill="#64748b" font-weight="700" letter-spacing="1">VENTANA 3</text>
    <rect x="408" y="360" width="442" height="44" rx="9" fill="#ccfbf1" stroke="#2dd4bf" stroke-width="2"/>
    <g fill="#134e4a" font-size="13" text-anchor="middle">
      <text x="449" y="387">el</text>
      <text x="539" y="387">sofá</text>
      <text x="629" y="387">porque</text>
      <text x="719" y="387">tiene</text>
      <text x="809" y="387">sueño</text>
    </g>
    <text x="866" y="387" fill="#0f766e">0–8</text>
  </g>

  <g font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#94a3b8">
    <text x="48" y="420">Cada ventana se convierte en un ejemplo x; su objetivo y es la misma ventana desplazada un token.</text>
  </g>
</svg>
