<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img" aria-labelledby="titulo-bucle desc-bucle">
  <title id="titulo-bucle">El bucle de entrenamiento de un GPT</title>
  <desc id="desc-bucle">Cada lote recorre cinco pasos: poner gradientes a cero, calcular logits y pérdida, retropropagar, actualizar los pesos y pasar al lote siguiente. El ciclo se repite durante varias épocas.</desc>
  <defs>
    <marker id="flecha-bucle" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1d4ed8"/>
    </marker>
    <marker id="flecha-epoca" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b45309"/>
    </marker>
    <linearGradient id="fondo-bucle" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="1" stop-color="#eef4fc"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="620" rx="18" fill="url(#fondo-bucle)"/>
  <text x="48" y="54" font-family="Georgia, 'Times New Roman', serif" font-size="28" font-weight="700" fill="#0f172a">Un lote, cinco operaciones, muchas repeticiones</text>
  <text x="48" y="82" font-family="system-ui, sans-serif" font-size="15" fill="#475569">El bucle interno recorre los lotes; el externo, las épocas</text>

  <g font-family="system-ui, sans-serif">
    <rect x="83" y="160" width="190" height="92" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="178" y="194" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">1 · Lote</text>
    <text x="178" y="219" text-anchor="middle" font-size="12" fill="#475569">entrada x, objetivo y</text>
    <text x="178" y="238" text-anchor="middle" font-size="12" fill="#64748b">forma [B, T]</text>

    <rect x="330" y="160" width="190" height="92" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="425" y="194" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">2 · Forward</text>
    <text x="425" y="219" text-anchor="middle" font-size="12" fill="#475569">logits [B, T, V]</text>
    <text x="425" y="238" text-anchor="middle" font-size="12" fill="#64748b">y pérdida media</text>

    <rect x="577" y="160" width="190" height="92" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="672" y="194" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">3 · backward()</text>
    <text x="672" y="219" text-anchor="middle" font-size="12" fill="#475569">gradientes ∂L/∂θ</text>
    <text x="672" y="238" text-anchor="middle" font-size="12" fill="#64748b">regla de la cadena</text>

    <rect x="577" y="330" width="190" height="92" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="672" y="364" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">4 · step()</text>
    <text x="672" y="389" text-anchor="middle" font-size="12" fill="#475569">AdamW actualiza θ</text>
    <text x="672" y="408" text-anchor="middle" font-size="12" fill="#64748b">con la tasa de aprendizaje</text>

    <rect x="330" y="330" width="190" height="92" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="425" y="364" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">5 · zero_grad()</text>
    <text x="425" y="389" text-anchor="middle" font-size="12" fill="#475569">vacía los gradientes</text>
    <text x="425" y="408" text-anchor="middle" font-size="12" fill="#64748b">antes del lote siguiente</text>

    <rect x="83" y="330" width="190" height="92" rx="12" fill="#fff7e6" stroke="#f0c27a" stroke-width="1.5"/>
    <text x="178" y="364" text-anchor="middle" font-size="16" font-weight="700" fill="#7c2d12">Fin de época</text>
    <text x="178" y="389" text-anchor="middle" font-size="12" fill="#92400e">evalúa validación</text>
    <text x="178" y="408" text-anchor="middle" font-size="12" fill="#92400e">y genera una muestra</text>

    <g stroke="#1d4ed8" stroke-width="2.5" fill="none" marker-end="url(#flecha-bucle)">
      <path d="M273 206 L318 206"/>
      <path d="M520 206 L565 206"/>
      <path d="M672 252 L672 318"/>
      <path d="M577 376 L532 376"/>
      <path d="M330 376 L285 376"/>
    </g>

    <path d="M178 330 C120 330 60 300 60 250 L60 206 L78 206" stroke="#b45309" stroke-width="2" fill="none" stroke-dasharray="6 5" marker-end="url(#flecha-epoca)"/>
    <text x="70" y="286" font-size="12" fill="#92400e">siguiente época</text>

    <rect x="330" y="475" width="437" height="70" rx="12" fill="#e8efff" stroke="#bfd3ff" stroke-width="1.5"/>
    <text x="548" y="503" text-anchor="middle" font-size="14" font-weight="700" fill="#1e3a8a">Regla de orden</text>
    <text x="548" y="526" text-anchor="middle" font-size="13" fill="#334155">zero_grad → forward y pérdida → backward → step</text>
  </g>

  <text x="48" y="586" font-family="system-ui, sans-serif" font-size="13" fill="#64748b">Diagrama propio de Aula LLM. «B» es el tamaño de lote, «T» la longitud y «V» el vocabulario.</text>
</svg>
