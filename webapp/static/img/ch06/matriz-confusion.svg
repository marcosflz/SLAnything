<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" role="img" aria-labelledby="title desc">
  <title id="title">Confusion matrix and classification metrics</title>
  <desc id="desc">A two by two confusion matrix with 40 true positives, 10 false positives, 20 false negatives, and 130 true negatives. The panel on the right gives accuracy 85 percent, precision 80 percent, recall 66.7 percent, and F1 72.7 percent.</desc>

  <rect x="0" y="0" width="960" height="470" rx="18" fill="#f8fafc" stroke="#cbd5e1"/>

  <text x="32" y="42" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#0f172a">Reading a 2×2 confusion matrix</text>
  <text x="32" y="66" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#475569">Spam is the positive class. Every prediction falls into exactly one cell.</text>

  <!-- Column headers -->
  <text x="202" y="108" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#475569" text-anchor="middle">Predicted spam</text>
  <text x="392" y="108" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#475569" text-anchor="middle">Predicted ham</text>

  <!-- Row labels -->
  <text x="42" y="180" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#475569">Actual</text>
  <text x="42" y="196" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#475569">spam</text>
  <text x="42" y="300" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#475569">Actual</text>
  <text x="42" y="316" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#475569">ham</text>

  <!-- Matrix -->
  <rect x="112" y="122" width="180" height="130" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="202" y="164" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#166534" text-anchor="middle">True positive</text>
  <text x="202" y="198" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" fill="#166534" text-anchor="middle">40</text>
  <text x="202" y="224" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#15803d" text-anchor="middle">spam detected</text>

  <rect x="302" y="122" width="180" height="130" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="392" y="164" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#92400e" text-anchor="middle">False negative</text>
  <text x="392" y="198" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" fill="#92400e" text-anchor="middle">20</text>
  <text x="392" y="224" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#b45309" text-anchor="middle">spam missed</text>

  <rect x="112" y="262" width="180" height="130" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="202" y="304" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#92400e" text-anchor="middle">False positive</text>
  <text x="202" y="338" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" fill="#92400e" text-anchor="middle">10</text>
  <text x="202" y="364" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#b45309" text-anchor="middle">ham blocked</text>

  <rect x="302" y="262" width="180" height="130" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="392" y="304" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#166534" text-anchor="middle">True negative</text>
  <text x="392" y="338" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" fill="#166534" text-anchor="middle">130</text>
  <text x="392" y="364" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#15803d" text-anchor="middle">ham allowed</text>

  <!-- Formulas panel -->
  <rect x="540" y="92" width="388" height="322" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="562" y="122" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#64748b" letter-spacing="1">METRICS FROM THE SAME COUNTS</text>

  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="562" y="158" font-size="13" font-weight="700" fill="#0f172a">Accuracy</text>
    <text x="562" y="178" font-size="12" fill="#475569">(TP + TN) / N</text>
    <text x="862" y="178" font-size="12" font-weight="700" fill="#166534" text-anchor="end">85.0 %</text>

    <line x1="562" y1="194" x2="906" y2="194" stroke="#e2e8f0"/>

    <text x="562" y="220" font-size="13" font-weight="700" fill="#0f172a">Precision</text>
    <text x="562" y="240" font-size="12" fill="#475569">TP / (TP + FP)</text>
    <text x="862" y="240" font-size="12" font-weight="700" fill="#166534" text-anchor="end">80.0 %</text>

    <line x1="562" y1="256" x2="906" y2="256" stroke="#e2e8f0"/>

    <text x="562" y="282" font-size="13" font-weight="700" fill="#0f172a">Recall</text>
    <text x="562" y="302" font-size="12" fill="#475569">TP / (TP + FN)</text>
    <text x="862" y="302" font-size="12" font-weight="700" fill="#166534" text-anchor="end">66.7 %</text>

    <line x1="562" y1="318" x2="906" y2="318" stroke="#e2e8f0"/>

    <text x="562" y="344" font-size="13" font-weight="700" fill="#0f172a">F1</text>
    <text x="562" y="364" font-size="12" fill="#475569">2 · P · R / (P + R)</text>
    <text x="862" y="364" font-size="12" font-weight="700" fill="#166534" text-anchor="end">72.7 %</text>
  </g>

  <text x="562" y="394" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" fill="#64748b">N = 200 messages · 60 spam · 140 ham</text>

  <text x="32" y="438" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#64748b">Accuracy adds every success. Precision and recall separate the two kinds of error.</text>
</svg>
