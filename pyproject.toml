[project]
name = "slanything"
version = "0.2.0"
description = "Plataforma bilingüe de cursos interactivos y autoría de unidades con OpenCode"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "ipykernel>=6.29",
    "ipywidgets>=8.1",
    "jinja2>=3.1",
    "jupyterlab>=4.2",
    "matplotlib>=3.9",
    "nbconvert>=7.16",
    "nbformat>=5.10",
    "numpy>=1.26",
    "pandas>=2.2",
    "psutil>=5.9",
    "pypdf>=5.0",
    "python-docx>=1.1",
    "python-multipart>=0.0.12",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pyyaml>=6.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["webapp/tests"]
addopts = "-q"
